services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medicence_db
    ports:
      - "3306:3306"
    volumes:
      - medicence_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: medicence_db
      DB_USER: root
      DB_PASSWORD: root
      DB_SSL: "false"
      DB_CREATE_IF_MISSING: "true"
      JWT_SECRET: bWVkaWNlbmNlLXN1cHBsaWVzLWp3dC1zZWNyZXQta2V5LTI1Ni1iaXRzLW1pbmltdW0tZm9yLWhzMjU2
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  medicence_mysql:
